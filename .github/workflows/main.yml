name: generate animation

on:
  # executa automaticamente a cada 24 horas
  schedule:
    - cron: "0 */24 * * *" 
  
  # permite rodar manualmente
  workflow_dispatch:
  
  # roda a cada push na branch master
  push:
    branches:
    - master
    
jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # gera a cobrinha com as cores do Flash
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: KauePiotto
          outputs: |
            dist/github-contribution-grid-snake-flash.svg?color_snake=#D00000&color_dots=#161b22,#7a1f1f,#a82828,#d00000,#FFD700
            
      # envia o conteúdo da pasta 'dist' para a branch 'output'
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
